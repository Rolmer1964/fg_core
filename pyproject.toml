[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fg_core"
version = "0.2.0"
description = "fg_core — integrador da família FinGuard (fg_rag, fg_guardrail, fg_triagem, ...)"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "fg_rag @ git+https://github.com/Rolmer1964/fg_rag.git@v0.1.0",
    "fg_guardrail @ git+https://github.com/Rolmer1964/fg_guardrail.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
